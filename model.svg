\documentclass[tikz,border=8pt]{standalone}
\usepackage{amsmath}
\usetikzlibrary{arrows.meta,calc}

\definecolor{mosFill}{HTML}{BBDDFB}
\definecolor{mosLine}{HTML}{1E7BD6}
\definecolor{humFill}{HTML}{FBB6E0}
\definecolor{humLine}{HTML}{C2189A}

\tikzset{
  mos/.style={draw=mosLine, fill=mosFill, rounded corners=2pt, minimum width=1.3cm, minimum height=0.75cm, inner sep=2pt},
  hum/.style={draw=humLine, fill=humFill, rounded corners=2pt, minimum width=1.3cm, minimum height=0.75cm, inner sep=2pt},
  mflow/.style={-{Stealth[length=1.8mm]}, mosLine, thick},
  hflow/.style={-{Stealth[length=1.8mm]}, humLine, thick},
  inf/.style={-{Stealth[length=1.8mm]}, mosLine, dashed},   % nyamuk -> manusia (Phi)
  back/.style={-{Stealth[length=1.8mm]}, humLine, dashed},  % manusia -> nyamuk (Psi)
  ret/.style={-{Stealth[length=1.8mm]}, gray, densely dotted}, % kehilangan kekebalan (delta)
  lbl/.style={font=\scriptsize, inner sep=1.5pt}
}

\begin{document}
\begin{tikzpicture}[>=Stealth]

% ---------- Nyamuk ----------
\node[mos] (Ifm) at (0, 3.6)  {$I_{fm}$};
\node[mos] (Sm)  at (0, 0)    {$S_m$};
\node[mos] (Ivm) at (0,-3.6)  {$I_{vm}$};

% ---------- Manusia: rentan ----------
\node[hum] (Shc) at (4.2, 1.8) {$S_{hc}$};
\node[hum] (Sha) at (4.2,-1.8) {$S_{ha}$};

% ---------- Manusia: terinfeksi ----------
\node[hum] (Ifhc) at (8.0, 3.6)  {$I_{fhc}$};
\node[hum] (Ifha) at (8.0, 1.2)  {$I_{fha}$};
\node[hum] (Ivhc) at (8.0,-1.2)  {$I_{vhc}$};
\node[hum] (Ivha) at (8.0,-3.6)  {$I_{vha}$};

% ---------- Manusia: sembuh ----------
\node[hum] (Rfhc) at (11.6, 3.6)  {$R_{fhc}$};
\node[hum] (Rfha) at (11.6, 1.2)  {$R_{fha}$};
\node[hum] (Rvhc) at (11.6,-1.2)  {$R_{vhc}$};
\node[hum] (Rvha) at (11.6,-3.6)  {$R_{vha}$};

% ---------- Alur nyamuk ----------
\draw[mflow] (-1.8,0) -- node[lbl,above]{$\tau_m$} (Sm.west);
\draw[mflow] (Sm.north) -- node[lbl,right]{$\Psi_f$} (Ifm.south);
\draw[mflow] (Sm.south) -- node[lbl,right]{$\Psi_v$} (Ivm.north);
\draw[mflow] (Ifm.north) -- ++(0,0.7) node[lbl,right]{$\mu_m$};
\draw[mflow] (Ivm.south) -- ++(0,-0.7) node[lbl,right]{$\mu_m$};
\draw[mflow] ($(Sm.north east)+(-0.2,0)$) -- ++(0,0.6) node[lbl,right]{$\mu_m$};

% ---------- Infeksi nyamuk -> manusia (Phi) ----------
\draw[inf] (Ifm.east) to[out=0,in=150] (Shc.north west);
\draw[inf] (Ifm.east) to[out=-10,in=170] (Sha.north west);
\draw[inf] (Ivm.east) to[out=10,in=190] (Shc.south west);
\draw[inf] (Ivm.east) to[out=0,in=210] (Sha.south west);

% ---------- Infeksi manusia -> nyamuk (Psi) ----------
\draw[back] ([yshift=-4pt]Ifhc.west) to[out=180,in=30]  (Sm.north east);
\draw[back] ([yshift=-4pt]Ifha.west) to[out=180,in=15]  (Sm.east);
\draw[back] ([yshift=-4pt]Ivhc.west) to[out=180,in=-15] (Sm.east);
\draw[back] ([yshift=-4pt]Ivha.west) to[out=180,in=-30] (Sm.south east);

% ---------- Manusia rentan ----------
\draw[hflow] (Shc.south) -- node[lbl,right]{$\gamma_h$} (Sha.north);
\draw[hflow] ($(Shc.north)+(0.15,0.9)$) -- node[lbl,right]{$\Lambda_h$} ($(Shc.north)+(0.15,0)$);
\draw[hflow] ($(Shc.north)+(-0.35,0)$) -- ++(0,0.6) node[lbl,above]{$\mu_h$};
\draw[hflow] ($(Sha.south)+(-0.35,0)$) -- ++(0,-0.6) node[lbl,below]{$\mu_h$};

% infeksi S -> I
\draw[hflow] (Shc.east) to[out=0,in=180] ([yshift=4pt]Ifhc.west);
\draw[hflow] (Shc.east) to[out=0,in=180] ([yshift=4pt]Ivhc.west);
\draw[hflow] (Sha.east) to[out=0,in=180] ([yshift=4pt]Ifha.west);
\draw[hflow] (Sha.east) to[out=0,in=180] ([yshift=4pt]Ivha.west);

% ---------- I -> R ----------
\foreach \a/\b/\s in {Ifhc/Rfhc/fc, Ifha/Rfha/fa, Ivhc/Rvhc/vc, Ivha/Rvha/va}{
  \draw[hflow] (\a) -- node[lbl,above]{$\sigma_{\s}$} (\b);
}

% ---------- Penuaan gamma_h (anak -> dewasa) ----------
\draw[hflow] (Ifhc.south) -- node[lbl,right]{$\gamma_h$} (Ifha.north);
\draw[hflow] (Ivhc.south) -- node[lbl,right]{$\gamma_h$} (Ivha.north);
\draw[hflow] (Rfhc.south) -- node[lbl,right]{$\gamma_h$} (Rfha.north);
\draw[hflow] (Rvhc.south) -- node[lbl,right]{$\gamma_h$} (Rvha.north);

% ---------- Kematian ----------
\foreach \n/\m in {Ifhc/fc, Ifha/fa, Ivhc/vc, Ivha/va}{
  \draw[hflow] ([xshift=0.4cm]\n.north) -- ++(0,0.45) node[lbl,right]{$\mu_h{+}m_{\m}$};
}
\foreach \n in {Rfhc,Rfha,Rvhc,Rvha}{
  \draw[hflow] (\n.east) -- node[lbl,above]{$\mu_h$} ++(1.4,0);
}

% ---------- Hilangnya kekebalan delta_h (R -> S) ----------
\draw[ret] (Rfhc.north) -- ++(0,0.9) -| node[lbl,pos=0.25,above]{$\delta_h$} (Shc.north east);
\draw[ret] (11.9,-0.825) -- (11.9,0.5) -- (4.85,0.5) -- (Shc.south east);
\draw[ret] (11.3,0.825)  -- (11.3,0.05) -- (4.85,0.05) -- (Sha.north east);
\draw[ret] (Rvha.south) -- ++(0,-0.9) -| (Sha.south east);

% ---------- Legenda ----------
\begin{scope}[shift={(0,-6.2)}]
  \draw[inf]  (0,0)  -- (0.9,0) node[right,font=\scriptsize]{$\Phi$: nyamuk $\to$ manusia};
  \draw[back] (4.6,0) -- (5.5,0) node[right,font=\scriptsize]{$\Psi$: manusia $\to$ nyamuk};
  \draw[ret]  (9.2,0) -- (10.1,0) node[right,font=\scriptsize]{$\delta_h$: sembuh $\to$ rentan};
\end{scope}

\end{tikzpicture}
\end{document}
