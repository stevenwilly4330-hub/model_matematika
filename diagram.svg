<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="600" viewBox="0 0 1000 600">

  <rect width="1000" height="600" fill="white"/>

  <defs>
    <marker id="blueArrow" markerWidth="8" markerHeight="8"
      refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#168fe0"/>
    </marker>
    <marker id="pinkArrow" markerWidth="8" markerHeight="8"
      refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c43b9b"/>
    </marker>

    <style>
      .bluebox {
        fill:#c5e5fa;
        stroke:#168fe0;
        stroke-width:1.5;
      }
      .pinkbox {
        fill:#f7c7e7;
        stroke:#c43b9b;
        stroke-width:1.5;
      }
      .blue {
        fill:none;
        stroke:#168fe0;
        stroke-width:2.2;
        marker-end:url(#blueArrow);
        stroke-linecap:round;
        stroke-linejoin:round;
      }
      .pink {
        fill:none;
        stroke:#c43b9b;
        stroke-width:2.2;
        marker-end:url(#pinkArrow);
        stroke-linecap:round;
        stroke-linejoin:round;
      }
      .dblue {
        fill:none;
        stroke:#168fe0;
        stroke-width:1.8;
        stroke-dasharray:6 5;
        marker-end:url(#blueArrow);
      }
      .dpink {
        fill:none;
        stroke:#c43b9b;
        stroke-width:1.8;
        stroke-dasharray:6 5;
        marker-end:url(#pinkArrow);
      }
      .state {
        font-family:"Times New Roman",serif;
        font-size:20px;
        font-style:italic;
        text-anchor:middle;
        dominant-baseline:middle;
        fill:#17243b;
      }
      .param {
        font-family:"Times New Roman",serif;
        font-size:15px;
        font-style:italic;
        fill:#222;
      }
    </style>
  </defs>

  <!-- KOLOM KIRI -->
  <rect class="bluebox" x="125" y="130" width="85" height="42" rx="5"/>
  <text class="state" x="167" y="151">I_fm</text>

  <rect class="bluebox" x="125" y="260" width="85" height="42" rx="5"/>
  <text class="state" x="167" y="281">S_m</text>

  <rect class="bluebox" x="125" y="390" width="85" height="42" rx="5"/>
  <text class="state" x="167" y="411">I_vm</text>

  <!-- KOLOM TENGAH -->
  <rect class="pinkbox" x="335" y="100" width="100" height="42" rx="5"/>
  <text class="state" x="385" y="121">I_fhc</text>

  <rect class="pinkbox" x="335" y="230" width="100" height="42" rx="5"/>
  <text class="state" x="385" y="251">I_fha</text>

  <rect class="pinkbox" x="335" y="360" width="100" height="42" rx="5"/>
  <text class="state" x="385" y="381">I_vhc</text>

  <rect class="pinkbox" x="335" y="490" width="100" height="42" rx="5"/>
  <text class="state" x="385" y="511">I_vha</text>

  <!-- KOLOM KANAN -->
  <rect class="pinkbox" x="570" y="100" width="100" height="42" rx="5"/>
  <text class="state" x="620" y="121">R_hc</text>

  <rect class="pinkbox" x="570" y="230" width="100" height="42" rx="5"/>
  <text class="state" x="620" y="251">R_ha</text>

  <rect class="pinkbox" x="570" y="360" width="100" height="42" rx="5"/>
  <text class="state" x="620" y="381">R_vc</text>

  <rect class="pinkbox" x="570" y="490" width="100" height="42" rx="5"/>
  <text class="state" x="620" y="511">R_va</text>

  <!-- PANAH KIRI: ALIRAN VERTIKAL -->
  <path class="blue" d="M167 130 V80"/>
  <text class="param" x="178" y="99">μ_m</text>

  <path class="blue" d="M167 172 V258"/>
  <text class="param" x="180" y="218">bλ_vm</text>

  <path class="blue" d="M167 302 V388"/>
  <text class="param" x="180" y="350">bλ_fm</text>

  <path class="blue" d="M167 432 V485"/>
  <text class="param" x="180" y="463">μ_m</text>

  <path class="blue" d="M45 281 H122"/>
  <text class="param" x="61" y="268">τ_m</text>

  <!-- TRANSMISI SILANG: GARIS PUTUS-PUTUS -->
  <path class="dpink"
        d="M210 281 C250 255 286 121 332 121"/>
  <text class="param" x="250" y="190">bλ_fh</text>

  <path class="dblue"
        d="M210 151 C260 151 280 251 332 251"/>
  <text class="param" x="245" y="201">bλ_vm</text>

  <path class="dblue"
        d="M210 151 C258 185 283 381 332 381"/>
  <text class="param" x="248" y="295">bλ_vh</text>

  <path class="dpink"
        d="M210 281 C260 310 282 511 332 511"/>
  <text class="param" x="246" y="408">bλ_vh</text>

  <path class="dpink"
        d="M210 411 C260 375 280 251 332 251"/>

  <path class="dblue"
        d="M210 411 C260 398 280 381 332 381"/>

  <path class="dblue"
        d="M210 411 C260 435 282 511 332 511"/>

  <!-- PANAH BIRU DARI I_fm KE KOMPATEMEN TENGAH -->
  <path class="blue" d="M210 151 L332 251"/>
  <path class="blue" d="M210 151 L332 381"/>

  <!-- PANAH MERAH MUDA DARI S_m DAN I_vm -->
  <path class="pink" d="M210 281 L332 121"/>
  <path class="pink" d="M210 411 L332 251"/>
  <path class="pink" d="M210 281 L332 511"/>

  <!-- KOLUM TENGAH: PANAH BERTEMU DI TENGAH -->
  <!-- Kotak 1 menuju bawah, kotak 2 menuju atas -->
  <path class="pink" d="M385 142 V177"/>
  <text class="param" x="396" y="161">γ_h</text>

  <path class="pink" d="M385 230 V195"/>
  <text class="param" x="396" y="220">μ_h</text>

  <!-- Kotak 2 dan 3 -->
  <path class="pink" d="M385 272 V307"/>
  <text class="param" x="396" y="291">γ_h</text>

  <path class="pink" d="M385 360 V325"/>
  <text class="param" x="396" y="350">μ_h</text>

  <!-- Kotak 3 dan 4 -->
  <path class="pink" d="M385 402 V437"/>
  <text class="param" x="396" y="421">γ_h</text>

  <path class="pink" d="M385 490 V455"/>
  <text class="param" x="396" y="480">μ_h</text>

  <!-- PANAH HORIZONTAL KE KANAN -->
  <path class="pink" d="M435 121 H567"/>
  <text class="param" x="485" y="109">σ_fh</text>

  <path class="pink" d="M435 251 H567"/>
  <text class="param" x="485" y="239">σ_fh</text>

  <path class="pink" d="M435 381 H567"/>
  <text class="param" x="485" y="369">σ_vh</text>

  <path class="pink" d="M435 511 H567"/>
  <text class="param" x="485" y="499">σ_vh</text>

  <!-- KOLOM KANAN: PANAH BERTEMU DI TENGAH -->
  <path class="pink" d="M620 142 V177"/>
  <text class="param" x="632" y="161">γ_h</text>

  <path class="pink" d="M620 230 V195"/>
  <text class="param" x="632" y="220">μ_h</text>

  <path class="pink" d="M620 272 V307"/>
  <text class="param" x="632" y="291">γ_h</text>

  <path class="pink" d="M620 360 V325"/>
  <text class="param" x="632" y="350">μ_h</text>

  <path class="pink" d="M620 402 V437"/>
  <text class="param" x="632" y="421">γ_h</text>

  <path class="pink" d="M620 490 V455"/>
  <text class="param" x="632" y="480">μ_h</text>

  <!-- KELUARAN SETIAP KOTAK KANAN -->
  <path class="pink" d="M670 121 H745"/>
  <text class="param" x="696" y="109">μ_h</text>

  <path class="pink" d="M670 251 H745"/>
  <text class="param" x="696" y="239">μ_h</text>

  <path class="pink" d="M670 381 H745"/>
  <text class="param" x="696" y="369">μ_h</text>

  <path class="pink" d="M670 511 H745"/>
  <text class="param" x="696" y="499">μ_h</text>

</svg>
