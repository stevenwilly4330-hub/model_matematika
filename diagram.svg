<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagram Model Matematika</title>

<style>
  body {
    margin: 0;
    padding: 20px;
    background: white;
    font-family: "Times New Roman", serif;
  }

  .diagram {
    width: 100%;
    overflow-x: auto;
  }

  svg {
    display: block;
    width: 100%;
    min-width: 850px;
    height: auto;
  }

  .blue-box {
    fill: #d9efff;
    stroke: #087dcc;
    stroke-width: 2.5;
  }

  .pink-box {
    fill: #f9d9f1;
    stroke: #c00091;
    stroke-width: 2.5;
  }

  .blue-line {
    fill: none;
    stroke: #0784df;
    stroke-width: 2.5;
  }

  .pink-line {
    fill: none;
    stroke: #c00091;
    stroke-width: 2.5;
  }

  .dashed-blue {
    fill: none;
    stroke: #0784df;
    stroke-width: 2;
    stroke-dasharray: 7 6;
  }

  .dashed-pink {
    fill: none;
    stroke: #ed2aa9;
    stroke-width: 2;
    stroke-dasharray: 7 6;
  }

  .state {
    font-size: 29px;
    font-style: italic;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .label {
    font-size: 21px;
    font-style: italic;
  }
</style>
</head>

<body>
<div class="diagram">
<svg viewBox="0 0 1100 650"
     xmlns="http://www.w3.org/2000/svg">

<defs>
  <marker id="blueArrow" markerWidth="8" markerHeight="8"
          refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#0784df"/>
  </marker>

  <marker id="pinkArrow" markerWidth="8" markerHeight="8"
          refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#c00091"/>
  </marker>
</defs>

<!-- =========================
     KOTAK BAGIAN KIRI
     ========================= -->

<rect class="blue-box" x="85" y="125" width="135" height="62" rx="8"/>
<text class="state" x="152" y="156">I<tspan font-size="18" dy="8">fm</tspan></text>

<rect class="blue-box" x="85" y="285" width="135" height="62" rx="8"/>
<text class="state" x="152" y="316">S<tspan font-size="18" dy="8">m</tspan></text>

<rect class="blue-box" x="85" y="445" width="135" height="62" rx="8"/>
<text class="state" x="152" y="476">I<tspan font-size="18" dy="8">vm</tspan></text>

<!-- Garis utama kiri -->
<path class="blue-line" d="M152 125 V55"
      marker-end="url(#blueArrow)"/>
<text class="label" x="172" y="75">μ<tspan font-size="14">m</tspan></text>

<path class="blue-line" d="M152 187 V285"
      marker-start="url(#blueArrow)"
      marker-end="url(#blueArrow)"/>
<text class="label" x="165" y="240">bλ<tspan font-size="14">vm</tspan></text>

<path class="blue-line" d="M152 347 V445"
      marker-end="url(#blueArrow)"/>
<text class="label" x="165" y="397">bλ<tspan font-size="14">fm</tspan></text>

<path class="blue-line" d="M152 507 V585"
      marker-end="url(#blueArrow)"/>
<text class="label" x="172" y="545">μ<tspan font-size="14">m</tspan></text>

<path class="blue-line" d="M10 316 H85"
      marker-end="url(#blueArrow)"/>
<text class="label" x="25" y="298">τ<tspan font-size="14">m</tspan></text>

<!-- =========================
     KOTAK BAGIAN TENGAH
     ========================= -->

<rect class="pink-box" x="425" y="90" width="145" height="62" rx="8"/>
<text class="state" x="497" y="121">I<tspan font-size="18" dy="8">fhc</tspan></text>

<rect class="pink-box" x="425" y="235" width="145" height="62" rx="8"/>
<text class="state" x="497" y="266">I<tspan font-size="18" dy="8">fha</tspan></text>

<rect class="pink-box" x="425" y="380" width="145" height="62" rx="8"/>
<text class="state" x="497" y="411">I<tspan font-size="18" dy="8">vhc</tspan></text>

<rect class="pink-box" x="425" y="525" width="145" height="62" rx="8"/>
<text class="state" x="497" y="556">I<tspan font-size="18" dy="8">vha</tspan></text>

<!-- Transisi vertikal tengah -->
<path class="pink-line" d="M490 152 V235"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="455" y="198">γ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M515 235 V152"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="525" y="198">μ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M490 297 V380"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="455" y="344">γ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M515 380 V297"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="525" y="344">μ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M490 442 V525"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="455" y="489">γ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M515 525 V442"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="525" y="489">μ<tspan font-size="14">h</tspan></text>

<!-- =========================
     KOTAK BAGIAN KANAN
     ========================= -->

<rect class="pink-box" x="770" y="90" width="140" height="62" rx="8"/>
<text class="state" x="840" y="121">R<tspan font-size="18" dy="8">hc</tspan></text>

<rect class="pink-box" x="770" y="235" width="140" height="62" rx="8"/>
<text class="state" x="840" y="266">R<tspan font-size="18" dy="8">ha</tspan></text>

<rect class="pink-box" x="770" y="380" width="140" height="62" rx="8"/>
<text class="state" x="840" y="411">R<tspan font-size="18" dy="8">vc</tspan></text>

<rect class="pink-box" x="770" y="525" width="140" height="62" rx="8"/>
<text class="state" x="840" y="556">R<tspan font-size="18" dy="8">va</tspan></text>

<!-- Transisi menuju R -->
<path class="pink-line" d="M570 121 H770"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="645" y="105">σ<tspan font-size="14">fh</tspan></text>

<path class="pink-line" d="M570 266 H770"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="645" y="250">σ<tspan font-size="14">fh</tspan></text>

<path class="pink-line" d="M570 411 H770"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="645" y="395">σ<tspan font-size="14">vh</tspan></text>

<path class="pink-line" d="M570 556 H770"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="645" y="540">σ<tspan font-size="14">vh</tspan></text>

<!-- Transisi vertikal bagian R -->
<path class="pink-line" d="M840 152 V235"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="855" y="198">γ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M840 297 V380"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="810" y="344">γ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M865 380 V297"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="875" y="344">μ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M840 442 V525"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="810" y="489">γ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M865 525 V442"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="875" y="489">μ<tspan font-size="14">h</tspan></text>

<!-- Panah keluar kanan -->
<path class="pink-line" d="M910 121 H1015"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="955" y="105">μ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M910 266 H1015"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="955" y="250">μ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M910 411 H1015"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="955" y="395">μ<tspan font-size="14">h</tspan></text>

<path class="pink-line" d="M910 556 H1015"
      marker-end="url(#pinkArrow)"/>
<text class="label" x="955" y="540">μ<tspan font-size="14">h</tspan></text>


<!-- ==================================================
     TEPAT 7 GARIS PUTUS-PUTUS DIAGONAL
     Garis putus-putus dipisahkan dari garis utama.
     ================================================== -->

<!-- 1. Biru: panah bolak-balik -->
<path class="dashed-blue"
      d="M220 145 Q315 165 425 260"
      marker-start="url(#blueArrow)"
      marker-end="url(#blueArrow)"/>

<!-- 2. Biru: satu arah -->
<path class="dashed-blue"
      d="M220 165 Q320 230 425 400"
      marker-end="url(#blueArrow)"/>

<!-- 3. Biru: panah bolak-balik -->
<path class="dashed-blue"
      d="M220 310 Q320 340 425 405"
      marker-start="url(#blueArrow)"
      marker-end="url(#blueArrow)"/>

<!-- 4. Biru: satu arah -->
<path class="dashed-blue"
      d="M220 475 Q325 500 425 555"
      marker-end="url(#blueArrow)"/>

<!-- 5. Pink: panah bolak-balik -->
<path class="dashed-pink"
      d="M220 310 Q320 190 425 120"
      marker-start="url(#pinkArrow)"
      marker-end="url(#pinkArrow)"/>

<!-- 6. Pink: satu arah -->
<path class="dashed-pink"
      d="M220 475 Q320 345 425 265"
      marker-end="url(#pinkArrow)"/>

<!-- 7. Pink: panah bolak-balik -->
<path class="dashed-pink"
      d="M220 310 Q320 440 425 555"
      marker-start="url(#pinkArrow)"
      marker-end="url(#pinkArrow)"/>

<!-- Label garis putus-putus -->
<text class="label" x="300" y="215">bλ<tspan font-size="14">vh</tspan></text>
<text class="label" x="310" y="365">bλ<tspan font-size="14">vh</tspan></text>
<text class="label" x="300" y="535">bλ<tspan font-size="14">vh</tspan></text>
<text class="label" x="300" y="135">bλ<tspan font-size="14">fh</tspan></text>

</svg>
</div>
</body>
</html>
