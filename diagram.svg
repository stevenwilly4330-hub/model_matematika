<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="680" viewBox="0 0 1100 680">
  <defs>
    <marker id="blueArrow" markerWidth="7" markerHeight="7"
            refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2386c8"/>
    </marker>
    <marker id="pinkArrow" markerWidth="7" markerHeight="7"
            refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#c83c9b"/>
    </marker>
    <marker id="grayArrow" markerWidth="7" markerHeight="7"
            refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#777"/>
    </marker>
    <style>
      .bluebox { fill:#b9def5; stroke:#2386c8; stroke-width:1.6; }
      .pinkbox { fill:#f3b9df; stroke:#c83c9b; stroke-width:1.6; }
      .blue {
        fill:none; stroke:#2386c8; stroke-width:2;
        marker-end:url(#blueArrow);
      }
      .pink {
        fill:none; stroke:#c83c9b; stroke-width:2;
        marker-end:url(#pinkArrow);
      }
      .dblue {
        fill:none; stroke:#58a6d6; stroke-width:1.8;
        stroke-dasharray:6 5; marker-end:url(#blueArrow);
      }
      .dpink {
        fill:none; stroke:#c83c9b; stroke-width:1.8;
        stroke-dasharray:6 5; marker-end:url(#pinkArrow);
      }
      .state {
        font-family:"Times New Roman",serif;
        font-size:21px; font-style:italic;
        text-anchor:middle; dominant-baseline:middle;
        fill:#17243b;
      }
      .p {
        font-family:"Times New Roman",serif;
        font-size:17px; font-style:italic; fill:#222;
      }
    </style>
  </defs>

