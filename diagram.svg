<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="600" viewBox="0 0 1000 600">

  <defs>
    <marker id="blueArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1689c7"/>
    </marker>
    <marker id="pinkArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c43c96"/>
    </marker>
    <marker id="darkArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#444"/>
    </marker>

    <style>
      .bluebox {
        fill: #b8def5;
        stroke: #1689c7;
        stroke-width: 1.5;
      }
      .pinkbox {
        fill: #f4b9df;
        stroke: #c43c96;
        stroke-width: 1.5;
      }
      .blueflow {
        fill: none;
        stroke: #1689c7;
        stroke-width: 1.8;
        marker-end: url(#blueArrow);
      }
      .pinkflow {
        fill: none;
        stroke: #c43c96;
        stroke-width: 1.8;
        marker-end: url(#pinkArrow);
      }
      .transmission {
        fill: none;
        stroke: #777;
        stroke-width: 1.5;
        stroke-dasharray: 6 5;
        marker-end: url(#darkArrow);
      }
      .state {
        font-family: "Times New Roman", serif;
        font-size: 19px;
        font-style: italic;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #17243b;
      }
      .param {
        font-family: "Times New Roman", serif;
        font-size: 15px;
        font-style: italic;
        fill: #222;
      }
    </style>
  </defs>

  <!-- KOMPATEMEN KIRI -->
  <rect class="bluebox" x="205" y="110" width="65" height="34" rx="4"/>
  <text class="state" x="237" y="127">Iₘ</text>

  <rect class="bluebox" x="205" y="190" width="65" height="34" rx="4"/>
  <text class="state" x="237" y="207">Sₘ</text>

  <rect class="bluebox" x="205" y="270" width="65" height="34" rx="4"/>
  <text class="state" x="237" y="287">Iᵥₘ</text>

  <!-- KOMPATEMEN TENGAH -->
  <rect class="pinkbox" x="365" y="95" width="75" height="34" rx="4"/>
  <text class="state" x="402" y="112">Iₕ꜀</text>

  <rect class="pinkbox" x="365" y="175" width="75" height="34" rx="4"/>
  <text class="state" x="402" y="192">Iₕₐ</text>

  <rect class="pinkbox" x="365" y="255" width="75" height="34" rx="4"/>
  <text class="state" x="402" y="272">Iᵥ꜀</text>

  <rect class="pinkbox" x="365" y="335" width="75" height="34" rx="4"/>
  <text class="state" x="402" y="352">Iᵥₐ</text>

  <!-- KOMPATEMEN KANAN -->
  <rect class="pinkbox" x="535" y="95" width="75" height="34" rx="4"/>
  <text class="state" x="572" y="112">Rₕ꜀</text>

  <rect class="pinkbox" x="535" y="175" width="75" height="34" rx="4"/>
  <text class="state" x="572" y="192">Rₕₐ</text>

  <rect class="pinkbox" x="535" y="255" width="75" height="34" rx="4"/>
  <text class="state" x="572" y="272">Rᵥ꜀</text>

  <rect class="pinkbox" x="535" y="335" width="75" height="34" rx="4"/>
  <text class="state" x="572" y="352">Rᵥₐ</text>

  <!-- INPUT TAU M -->
  <path class="blueflow" d="M150 207 H202"/>
  <text class="param" x="166" y="197">τₘ</text>

  <!-- ALIRAN VERTIKAL KIRI -->
  <path class="blueflow" d="M237 110 V72"/>
  <text class="param" x="244" y="88">μₘ</text>

  <path class="blueflow" d="M237 144 V187"/>
  <text class="param" x="247" y="169">bλᵥₘ</text>

  <path class="blueflow" d="M237 224 V267"/>
  <text class="param" x="247" y="251">bλᶠₘ</text>

  <path class="blueflow" d="M237 304 V342"/>
  <text class="param" x="246" y="327">μₘ</text>

  <!-- TRANSMISI PUTUS-PUTUS DARI KIRI KE TENGAH -->
  <path class="transmission"
        d="M270 127 C310 127 322 112 362 112"/>
  <text class="param" x="300" y="111">bλᶠₕ</text>

  <path class="transmission"
        d="M270 207 C315 207 322 192 362 192"/>
  <text class="param" x="298" y="190">bλᵥₘ</text>

  <path class="transmission"
        d="M270 207 C315 225 323 272 362 272"/>
  <text class="param" x="295" y="244">bλₕₘ</text>

  <path class="transmission"
        d="M270 287 C315 310 323 352 362 352"/>
  <text class="param" x="295" y="322">bλᵥₕ</text>

  <!-- HUBUNGAN SILANG -->
  <path class="transmission"
        d="M270 127 C315 145 322 175 362 192"/>

  <path class="transmission"
        d="M270 127 C315 175 322 255 362 272"/>

  <path class="transmission"
        d="M270 287 C315 260 322 215 362 192"/>

  <path class="transmission"
        d="M270 287 C315 280 322 365 362 352"/>

  <!-- TRANSISI VERTIKAL DI TENGAH -->
  <path class="pinkflow" d="M402 95 V70"/>
  <text class="param" x="409" y="82">μₕ</text>

  <path class="pinkflow" d="M402 129 V172"/>
  <text class="param" x="410" y="153">γₕ</text>

  <path class="pinkflow" d="M402 209 V252"/>
  <text class="param" x="410" y="233">μₕ</text>

  <path class="pinkflow" d="M402 289 V332"/>
  <text class="param" x="410" y="313">γₕ</text>

  <path class="pinkflow" d="M402 369 V405"/>
  <text class="param" x="410" y="393">μₕ</text>

  <!-- TRANSMISI KE KOMPATEMEN PEMULIHAN -->
  <path class="pinkflow" d="M440 112 H532"/>
  <text class="param" x="478" y="101">σₕ</text>

  <path class="pinkflow" d="M440 192 H532"/>
  <text class="param" x="478" y="181">σₕ</text>

  <path class="pinkflow" d="M440 272 H532"/>
  <text class="param" x="478" y="261">σᵥₕ</text>

  <path class="pinkflow" d="M440 352 H532"/>
  <text class="param" x="478" y="341">σᵥₕ</text>

  <!-- ALIRAN VERTIKAL DI KANAN -->
  <path class="pinkflow" d="M572 95 V70"/>
  <text class="param" x="580" y="82">μₕ</text>

  <path class="pinkflow" d="M572 129 V172"/>
  <text class="param" x="580" y="153">γₕ</text>

  <path class="pinkflow" d="M572 209 V252"/>
  <text class="param" x="580" y="233">γₕ</text>

  <path class="pinkflow" d="M572 289 V332"/>
  <text class="param" x="580" y="313">γₕ</text>

  <path class="pinkflow" d="M572 369 V405"/>
  <text class="param" x="580" y="393">μₕ</text>

  <!-- KELUARAN KANAN -->
  <path class="pinkflow" d="M610 112 H670"/>
  <text class="param" x="625" y="101">μₕ</text>

  <path class="pinkflow" d="M610 192 H670"/>
  <text class="param" x="625" y="181">μₕ</text>

  <path class="pinkflow" d="M610 272 H670"/>
  <text class="param" x="625" y="261">μₕ</text>

  <path class="pinkflow" d="M610 352 H670"/>
  <text class="param" x="625" y="341">μₕ</text>

</svg>
