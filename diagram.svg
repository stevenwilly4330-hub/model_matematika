<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="650" viewBox="0 0 1100 650">

  <rect width="1100" height="650" fill="#ffffff"/>

  <defs>
    <marker id="blueArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#168fe0"/>
    </marker>
    <marker id="pinkArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c43b9b"/>
    </marker>

    <style>
      .bluebox {
        fill: #c8e6fa;
        stroke: #168fe0;
        stroke-width: 1.6;
      }
      .pinkbox {
        fill: #f8c8e8;
        stroke: #c43b9b;
        stroke-width: 1.6;
      }
      .blue {
        fill: none;
        stroke: #168fe0;
        stroke-width: 2;
        marker-end: url(#blueArrow);
      }
      .pink {
        fill: none;
        stroke: #c43b9b;
        stroke-width: 2;
        marker-end: url(#pinkArrow);
      }
      .dblue {
        fill: none;
        stroke: #168fe0;
        stroke-width: 2;
        stroke-dasharray: 7 5;
        marker-end: url(#blueArrow);
      }
      .dpink {
        fill: none;
        stroke: #c43b9b;
        stroke-width: 2;
        stroke-dasharray: 7 5;
        marker-end: url(#pinkArrow);
      }
      .state {
        font-family: "Times New Roman", serif;
        font-size: 21px;
        font-style: italic;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #17243b;
      }
      .param {
        font-family: "Times New Roman", serif;
        font-size: 16px;
        font-style: italic;
        fill: #222222;
      }
    </style>
  </defs>

  <!-- ================================= -->
  <!-- KOLOM KIRI                       -->
  <!-- ================================= -->

  <rect class="bluebox" x="125" y="125" width="100" height="48" rx="5"/>
  <text class="state" x="175" y="149">I_fm</text>

  <rect class="bluebox" x="125" y="285" width="100" height="48" rx="5"/>
  <text class="state" x="175" y="309">S_m</text>

  <rect class="bluebox" x="125" y="445" width="100" height="48" rx="5"/>
  <text class="state" x="175" y="469">I_vm</text>

  <!-- Aliran vertikal kiri -->
  <path class="blue" d="M175 125 V75"/>
  <text class="param" x="187" y="96">μ_m</text>

  <path class="blue" d="M175 285 V175"/>
  <text class="param" x="187" y="230">bλ_vm</text>

  <path class="blue" d="M175 333 V445"/>
  <text class="param" x="187" y="395">bλ_fm</text>

  <path class="blue" d="M175 493 V545"/>
  <text class="param" x="187" y="526">μ_m</text>

  <!-- Masuk ke S_m -->
  <path class="blue" d="M42 309 H121"/>
  <text class="param" x="58" y="296">τ_m</text>

  <!-- ================================= -->
  <!-- KOLOM TENGAH                     -->
  <!-- ================================= -->

  <rect class="pinkbox" x="405" y="85" width="105" height="48" rx="5"/>
  <text class="state" x="457" y="109">I_fhc</text>

  <rect class="pinkbox" x="405" y="225" width="105" height="48" rx="5"/>
  <text class="state" x="457" y="249">I_fha</text>

  <rect class="pinkbox" x="405" y="365" width="105" height="48" rx="5"/>
  <text class="state" x="457" y="389">I_vhc</text>

  <rect class="pinkbox" x="405" y="505" width="105" height="48" rx="5"/>
  <text class="state" x="457" y="529">I_vha</text>

  <!-- ================================= -->
  <!-- KOLOM KANAN                      -->
  <!-- ================================= -->

  <rect class="pinkbox" x="700" y="85" width="105" height="48" rx="5"/>
  <text class="state" x="752" y="109">R_hc</text>

  <rect class="pinkbox" x="700" y="225" width="105" height="48" rx="5"/>
  <text class="state" x="752" y="249">R_ha</text>

  <rect class="pinkbox" x="700" y="365" width="105" height="48" rx="5"/>
  <text class="state" x="752" y="389">R_vc</text>

  <rect class="pinkbox" x="700" y="505" width="105" height="48" rx="5"/>
  <text class="state" x="752" y="529">R_va</text>

  <!-- ================================= -->
  <!-- TRANSMISI DIAGONAL PUTUS-PUTUS   -->
  <!-- PANAH BIRU: ARAH BOLAK-BALIK     -->
  <!-- ================================= -->

  <!-- I_fm menuju I_fha -->
  <path class="dblue"
        d="M225 139 C285 150 330 205 402 241"/>

  <!-- I_fha menuju I_fm -->
  <path class="dblue"
        d="M402 258 C330 230 285 180 225 157"/>

  <!-- I_fm menuju I_vhc -->
  <path class="dblue"
        d="M225 145 C300 205 330 330 402 379"/>

  <!-- I_vhc menuju I_fm -->
  <path class="dblue"
        d="M402 395 C325 355 295 240 225 163"/>

  <!-- I_vm menuju I_vhc -->
  <path class="dblue"
        d="M225 462 C290 440 335 410 402 389"/>

  <!-- I_vhc menuju I_vm -->
  <path class="dblue"
        d="M402 402 C330 438 285 475 225 480"/>

  <!-- I_vm menuju I_fha -->
  <path class="dblue"
        d="M225 458 C295 400 330 300 402 254"/>

  <!-- I_fha menuju I_vm -->
  <path class="dblue"
        d="M402 266 C335 315 290 420 225 474"/>

  <!-- Label transmisi biru -->
  <text class="param" x="285" y="180">bλ_vm</text>
  <text class="param" x="300" y="290">bλ_vh</text>
  <text class="param" x="286" y="425">bλ_fm</text>

  <!-- ================================= -->
  <!-- TRANSMISI DIAGONAL PUTUS-PUTUS   -->
  <!-- PANAH MERAH MUDA                 -->
  <!-- ================================= -->

  <!-- S_m menuju I_fhc -->
  <path class="dpink"
        d="M225 300 C295 255 340 145 402 109"/>

  <!-- I_fhc menuju S_m -->
  <path class="dpink"
        d="M402 125 C340 165 295 275 225 316"/>

  <!-- S_m menuju I_vha -->
  <path class="dpink"
        d="M225 315 C300 365 340 475 402 521"/>

  <!-- I_vha menuju S_m -->
  <path class="dpink"
        d="M402 535 C335 490 290 375 225 329"/>

  <!-- I_vm menuju I_fhc -->
  <path class="dpink"
        d="M225 455 C295 365 335 195 402 116"/>

  <!-- I_fhc menuju I_vm -->
  <path class="dpink"
        d="M402 131 C335 220 295 390 225 482"/>

  <!-- Label transmisi merah muda -->
  <text class="param" x="290" y="230">bλ_fh</text>
  <text class="param" x="290" y="455">bλ_vh</text>

  <!-- ================================= -->
  <!-- PANAH VERTIKAL KOLOM TENGAH       -->
  <!-- ================================= -->

  <!-- I_fhc ke bawah menuju I_fha -->
  <path class="pink" d="M457 133 V177"/>
  <text class="param" x="468" y="155">γ_h</text>

  <!-- I_fha ke atas menuju I_fhc -->
  <path class="pink" d="M457 225 V181"/>
  <text class="param" x="468" y="214">μ_h</text>

  <!-- I_fha ke bawah menuju I_vhc -->
  <path class="pink" d="M457 273 V317"/>
  <text class="param" x="468" y="295">γ_h</text>

  <!-- I_vhc ke atas menuju I_fha -->
  <path class="pink" d="M457 365 V321"/>
  <text class="param" x="468" y="354">μ_h</text>

  <!-- I_vhc ke bawah menuju I_vha -->
  <path class="pink" d="M457 413 V457"/>
  <text class="param" x="468" y="435">γ_h</text>

  <!-- I_vha ke atas menuju I_vhc -->
  <path class="pink" d="M457 505 V461"/>
  <text class="param" x="468" y="494">μ_h</text>

  <!-- ================================= -->
  <!-- PANAH HORIZONTAL KE KANAN         -->
  <!-- ================================= -->

  <path class="pink" d="M510 109 H697"/>
  <text class="param" x="565" y="96">σ_fh</text>

  <path class="pink" d="M510 249 H697"/>
  <text class="param" x="565" y="236">σ_fh</text>

  <path class="pink" d="M510 389 H697"/>
  <text class="param" x="565" y="376">σ_vh</text>

  <path class="pink" d="M510 529 H697"/>
  <text class="param" x="565" y="516">σ_vh</text>

  <!-- ================================= -->
  <!-- KOLOM KANAN: R_hc HANYA KE BAWAH -->
  <!-- ================================= -->

  <path class="pink" d="M752 133 V220"/>
  <text class="param" x="764" y="177">γ_h</text>

  <!-- R_ha dan R_vc: arah berlawanan -->
  <path class="pink" d="M752 273 V317"/>
  <text class="param" x="764" y="295">γ_h</text>

  <path class="pink" d="M752 365 V321"/>
  <text class="param" x="764" y="354">μ_h</text>

  <!-- R_vc dan R_va: arah berlawanan -->
  <path class="pink" d="M752 413 V457"/>
  <text class="param" x="764" y="435">γ_h</text>

  <path class="pink" d="M752 505 V461"/>
  <text class="param" x="764" y="494">μ_h</text>

  <!-- ================================= -->
  <!-- KELUARAN KOLOM KANAN              -->
  <!-- ================================= -->

  <path class="pink" d="M805 109 H895"/>
  <text class="param" x="838" y="96">μ_h</text>

  <path class="pink" d="M805 249 H895"/>
  <text class="param" x="838" y="236">μ_h</text>

  <path class="pink" d="M805 389 H895"/>
  <text class="param" x="838" y="376">μ_h</text>

  <path class="pink" d="M805 529 H895"/>
  <text class="param" x="838" y="516">μ_h</text>

</svg>
