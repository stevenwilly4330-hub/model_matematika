<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="850" viewBox="0 0 1200 850">

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9"
            refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#222"/>
    </marker>

    <style>
      .node {
        fill: #bdbdbd;
        stroke: #888;
        stroke-width: 1.2;
      }
      .flow {
        fill: none;
        stroke: #222;
        stroke-width: 2;
        marker-end: url(#arrow);
      }
      .dash {
        fill: none;
        stroke: #333;
        stroke-width: 2;
        stroke-dasharray: 9 7;
        marker-end: url(#arrow);
      }
      .state {
        font-family: "Times New Roman", serif;
        font-size: 24px;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #111;
      }
      .label {
        font-family: "Times New Roman", serif;
        font-size: 19px;
        fill: #111;
      }
    </style>
  </defs>

  <!-- KOTAK KIRI: KOMPATEMEN NYAMUK -->
  <rect class="node" x="100" y="365" width="100" height="60"/>
  <text class="state" x="150" y="395">Sₘ</text>

  <rect class="node" x="100" y="185" width="100" height="60"/>
  <text class="state" x="150" y="215">Iₜₘ</text>

  <rect class="node" x="100" y="545" width="100" height="60"/>
  <text class="state" x="150" y="575">Iᵥₘ</text>

  <!-- KOTAK TENGAH: KOMPATEMEN MANUSIA -->
  <rect class="node" x="430" y="100" width="115" height="60"/>
  <text class="state" x="487" y="130">Iₜₕ꜀</text>

  <rect class="node" x="430" y="285" width="115" height="60"/>
  <text class="state" x="487" y="315">Iₜₕₐ</text>

  <rect class="node" x="430" y="470" width="115" height="60"/>
  <text class="state" x="487" y="500">Iᵥₕ꜀</text>

  <rect class="node" x="430" y="655" width="115" height="60"/>
  <text class="state" x="487" y="685">Iᵥₕₐ</text>

  <!-- KOTAK KANAN: KOMPATEMEN R -->
  <rect class="node" x="790" y="100" width="115" height="60"/>
  <text class="state" x="847" y="130">Rₜₕ꜀</text>

  <rect class="node" x="790" y="285" width="115" height="60"/>
  <text class="state" x="847" y="315">Rₜₕₐ</text>

  <rect class="node" x="790" y="470" width="115" height="60"/>
  <text class="state" x="847" y="500">Rᵥₕ꜀</text>

  <rect class="node" x="790" y="655" width="115" height="60"/>
  <text class="state" x="847" y="685">Rᵥₕₐ</text>

  <!-- INPUT KE S_m -->
  <path class="flow" d="M20 395 H97"/>
  <text class="label" x="28" y="375">τₘ</text>

  <!-- ALIRAN S_m KE KOMPATEMEN ATAS DAN BAWAH -->
  <path class="flow" d="M150 365 V248"/>
  <text class="label" x="166" y="310">bλₜₘ</text>

  <path class="flow" d="M150 425 V542"/>
  <text class="label" x="166" y="490">bλᵥₘ</text>

  <!-- KELUARAN KOMPATEMEN KIRI -->
  <path class="flow" d="M150 185 V125"/>
  <text class="label" x="164" y="153">μₘ</text>

  <path class="flow" d="M150 605 V665"/>
  <text class="label" x="164" y="642">μₘ</text>

  <!-- TRANSMISI PUTUS-PUTUS DARI KIRI KE TENGAH -->
  <path class="dash" d="M200 215 C290 215 340 130 427 130"/>
  <text class="label" x="290" y="175">bλₜₕ꜀</text>

  <path class="dash" d="M200 395 C290 395 340 315 427 315"/>
  <text class="label" x="292" y="355">bλₜₕₐ</text>

  <path class="dash" d="M200 395 C290 430 340 500 427 500"/>
  <text class="label" x="292" y="455">bλᵥₕ꜀</text>

  <path class="dash" d="M200 575 C290 610 340 685 427 685"/>
  <text class="label" x="290" y="640">bλᵥₕₐ</text>

  <!-- TRANSMISI SILANG -->
  <path class="dash" d="M200 215 C290 260 340 455 427 500"/>
  <path class="dash" d="M200 575 C290 530 340 330 427 315"/>
  <path class="dash" d="M200 395 C300 300 330 200 427 130"/>
  <path class="dash" d="M200 395 C300 490 330 600 427 685"/>

  <!-- ALIRAN ANTARKOMPATEMEN TENGAH -->
  <path class="flow" d="M487 160 V282"/>
  <text class="label" x="502" y="230">μₕ</text>

  <path class="flow" d="M487 345 V467"/>
  <text class="label" x="502" y="415">μₕ</text>

  <path class="flow" d="M487 530 V652"/>
  <text class="label" x="502" y="600">μₕ</text>

  <!-- DARI TENGAH KE KANAN -->
  <path class="flow" d="M545 130 H787"/>
  <text class="label" x="650" y="115">σₕ</text>

  <path class="flow" d="M545 315 H787"/>
  <text class="label" x="650" y="300">σₕ</text>

  <path class="flow" d="M545 500 H787"/>
  <text class="label" x="650" y="485">σₕ</text>

  <path class="flow" d="M545 685 H787"/>
  <text class="label" x="650" y="670">σₕ</text>

  <!-- KELUARAN KOMPATEMEN KANAN -->
  <path class="flow" d="M905 130 H1030"/>
  <text class="label" x="940" y="112">μₕ</text>

  <path class="flow" d="M905 315 H1030"/>
  <text class="label" x="940" y="297">μₕ</text>

  <path class="flow" d="M905 500 H1030"/>
  <text class="label" x="940" y="482">μₕ</text>

  <path class="flow" d="M905 685 H1030"/>
  <text class="label" x="940" y="667">μₕ</text>

  <!-- PANAH VERTIKAL PADA KOMPATEMEN KANAN -->
  <path class="flow" d="M847 160 V282"/>
  <text class="label" x="862" y="230">μₕ</text>

  <path class="flow" d="M847 345 V467"/>
  <text class="label" x="862" y="415">μₕ</text>

  <path class="flow" d="M847 530 V652"/>
  <text class="label" x="862" y="600">μₕ</text>

</svg>
